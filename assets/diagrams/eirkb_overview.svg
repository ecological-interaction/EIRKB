<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="890" viewBox="0 0 1200 890" role="img" aria-labelledby="title description">
<title id="title">EIRKB — research organisation</title>
<desc id="description">EIRKB organises literature and concepts through Historical Arc (HA), Intellectual Lineages (IL) and Intellectual Map (IM). These are project research constructs, not universal classifications. Identity, metadata, relationships and provenance support the narrative and reference registers. SQLite and semantic exports remain planned.</desc>
