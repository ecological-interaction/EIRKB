<title id="title">EIRKB — reference corpus and developing federation</title>
<desc id="description">EIRKB reference corpus, structured JSON and human-readable presentations connect conceptually through developing DRM conventions to local analysis, synthesis and emerging research uses. No HA, IL or IM memberships, new taxonomy or operational federation are asserted.</desc>
